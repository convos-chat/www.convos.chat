<!DOCTYPE html>
<html lang="en">
  <head>
    {{ $desc := .Description | default .Summary | default .Title -}}
    <title>{{ .Title }} - Convos</title>
    <meta name="description" content="{{ $desc }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@convosby">
    <meta property="og:type" content="object">
    <meta property="og:site_name" content="Convos">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta name="twitter:description" property="og:description" content="{{ $desc }}">
    {{ with .Params.image -}}
    <meta name="twitter:image:src" property="og:image" content="{{ . }}">
    {{- end }}
    <meta name="twitter:title" property="og:title" content="{{ .Title }}">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="alternate" type="application/rss+xml" title="Convos Blog" href="/blog/index.xml">
    <link rel="stylesheet" type="text/css" href="/assets/style.css">
    <link rel="stylesheet" type="text/css" href="/themes/convos_color-scheme-light.css">
    <link rel="stylesheet" type="text/css" href="/assets/cms-overrides.css">
  </head>
  <body class="no-js no-notify no-mouse no-touch for-cms">
    {{ block "main" . }}{{ end }}
  </body>
</html>
